<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>SHiESTYBUDDY Embark Connector</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #1a1a1a;
        color: #fff;
        width: 300px;
        padding: 16px;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid #333;
      }

      .logo {
        width: 32px;
        height: 32px;
        background: linear-gradient(135deg, #00ff88, #00cc6a);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 14px;
        color: #000;
      }

      .title {
        font-size: 14px;
        font-weight: 600;
      }

      .subtitle {
        font-size: 11px;
        color: #888;
      }

      .status-card {
        background: #252525;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 12px;
      }

      .status-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }

      .status-row:last-child {
        margin-bottom: 0;
      }

      .status-label {
        font-size: 12px;
        color: #888;
      }

      .status-value {
        font-size: 12px;
        font-weight: 500;
      }

      .status-connected {
        color: #00ff88;
      }

      .status-disconnected {
        color: #ff6b6b;
      }

      .embark-id {
        color: #00ff88;
        font-family: monospace;
      }

      .timer-warning {
        color: #ffaa00;
      }

      .btn {
        width: 100%;
        padding: 10px 16px;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
      }

      .btn-primary {
        background: #00ff88;
        color: #000;
      }

      .btn-primary:hover {
        background: #00e67a;
      }

      .btn-secondary {
        background: #333;
        color: #fff;
        margin-top: 8px;
      }

      .btn-secondary:hover {
        background: #444;
      }

      .btn-danger {
        background: transparent;
        color: #ff6b6b;
        border: 1px solid #ff6b6b;
        margin-top: 8px;
      }

      .btn-danger:hover {
        background: rgba(255, 107, 107, 0.1);
      }

      .loading {
        text-align: center;
        padding: 20px;
        color: #888;
      }

      .help-text {
        font-size: 12px;
        color: #888;
        margin-bottom: 12px;
        text-align: center;
      }

      .spinner {
        width: 24px;
        height: 24px;
        border: 2px solid #333;
        border-top-color: #00ff88;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 8px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .footer {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid #333;
        text-align: center;
        font-size: 11px;
        color: #666;
      }

      .footer a {
        color: #00ff88;
        text-decoration: none;
      }

      .error-message {
        background: rgba(255, 107, 107, 0.1);
        border: 1px solid #ff6b6b;
        border-radius: 6px;
        padding: 10px 12px;
        margin-bottom: 12px;
        font-size: 12px;
        color: #ff6b6b;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="logo">SHiESTYBUDDYdiv>
      <div>
        <div class="title">SHiESTYBUDDY</div>
        <div class="subtitle">Embark Connector</div>
      </div>
    </div>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      <div>Checking status...</div>
    </div>

    <div id="connected" style="display: none">
      <div class="status-card">
        <div class="status-row">
          <span class="status-label">Status</span>
          <span class="status-value status-connected">Connected</span>
        </div>
        <div class="status-row">
          <span class="status-label">Embark ID</span>
          <span class="status-value embark-id" id="embarkId">-</span>
        </div>
        <div class="status-row">
          <span class="status-label">Last synced</span>
          <span class="status-value" id="lastSynced">-</span>
        </div>
        <div class="status-row">
          <span class="status-label">Next sync</span>
          <span class="status-value" id="nextSync">-</span>
        </div>
        <div class="status-row">
          <span class="status-label">Re-auth</span>
          <span class="status-value" id="reauthTimer">-</span>
        </div>
      </div>
      <button class="btn btn-secondary" id="refreshBtn">Refresh Session</button>
      <button class="btn btn-danger" id="disconnectBtn">Disconnect</button>
    </div>

    <div id="disconnected" style="display: none">
      <div class="status-card">
        <div class="status-row">
          <span class="status-label">Status</span>
          <span class="status-value status-disconnected">Not Connected</span>
        </div>
      </div>
      <div id="errorMessage" class="error-message" style="display: none"></div>
      <p class="help-text">
        Log in to your Embark account, then click "Check Status"
      </p>
      <button class="btn btn-primary" id="openPortalBtn">
        Open Embark Login
      </button>
      <button class="btn btn-secondary" id="checkStatusBtn">
        Check Status
      </button>
    </div>

    <div class="footer">
      <a href="https://shiesty.me" target="_blank">shiesty.me</a>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
